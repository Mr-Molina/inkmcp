- id: WIN-DESKTOP-001
  name: Windows Interactive Desktop Isolation, Window Inspection & Visibility Gate
  failure_type: behavioral
  root_cause_category: desktop_station_isolation
  description: Windows execution environments run child processes on isolated desktop
    objects (exebox-...), rendering GUI applications invisible on physical monitors.
    Furthermore, .NET Process.MainWindowTitle and PowerShell Get-Process return empty
    strings for GTK, Electron, Qt, and Blender windows even when fully visible. Agents
    must route child GUI processes to WinSta0\Default, must never deduce invisibility
    from empty MainWindowTitle, and must verify physical HWND visibility using Win32
    EnumWindows or inspect_desktop_windows.py.
  escalation_level: 3
  current_mitigation: automation — Invariant 51 in INFRASTRUCTURE_INVARIANTS.md, launch_interactive.py
    routing, inspect_desktop_windows.py inspection tool, and global rule windows-gui-desktop.md
  mitigation_target: C:\Users\jmolina\.gemini\config\rules\windows-gui-desktop.md
  occurrences:
  - session: conversation://8f8a2aca-c5ef-4e6b-b769-19fa6ad08cd0
    date: '2026-09-29'
    postmortem_ref: PM-2026-0929-001
