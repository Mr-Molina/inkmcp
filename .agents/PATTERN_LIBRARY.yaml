- id: WIN-ENC-001
  name: Windows Subprocess Stdio Default cp1252 Decoding Collision
  failure_type: logic
  root_cause_category: windows_stdio_encoding
  description: Windows subprocess.Popen(text=True) defaults to legacy cp1252 encoding
    instead of UTF-8, crashing on multi-byte characters or emojis in tool outputs.
    Agents must explicitly specify encoding="utf-8" and set PYTHONIOENCODING=utf-8.
  escalation_level: 1
  current_mitigation: advisory — pass encoding="utf-8" to all subprocess calls and
    set PYTHONIOENCODING=utf-8 in environment
  mitigation_target: C:\Users\jmolina\.gemini\config\pattern-library.yaml
  occurrences:
  - session: conversation://8f8a2aca-c5ef-4e6b-b769-19fa6ad08cd0
    date: '2026-09-29'
    postmortem_ref: PM-2026-0929-003
