[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "inkmcp"
version = "0.1.0"
description = "Model Context Protocol (MCP) server for Inkscape vector graphics"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "inkex>=1.3.0",
]

[project.scripts]
inkmcp = "inkmcp.inkscape_mcp_server:main"

[tool.setuptools]
py-modules = ["inkscape_mcp"]
packages = [
    "inkmcp",
    "inkmcp.backends",
    "inkmcp.inkmcpops",
]
