[build-system]
requires = ["setuptools>=61.0,<90.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "inkmcp"
version = "0.1.0"
description = "Model Context Protocol (MCP) server for Inkscape vector graphics"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.28.1,<2.0.0",
    "inkex>=1.4.1,<2.0.0",
    "lxml>=5.3.0,<6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<10.0.0",
]

[project.scripts]
inkmcp = "inkmcp.inkscape_mcp_server:main"

[tool.setuptools]
py-modules = ["inkscape_mcp"]
packages = [
    "inkmcp",
    "inkmcp.backends",
    "inkmcp.inkmcpops",
]
