name: Create Release

'on':
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.11
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r inkmcp/requirements.txt
          pip install pytest

      - name: Compile check
        run: |
          python -m compileall inkmcp/

      - name: Run tests
        run: |
          pytest -v

  build:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Create Plugin Zip
        run: |
          # Create a temporary directory for the package
          mkdir -p package

          # Copy the main extension files
          cp inkscape_mcp.inx package/
          cp inkscape_mcp.py package/

          # Copy the entire inkmcp subfolder maintaining structure
          cp -r inkmcp package/

          # Remove transient/cache files before zipping
          find package -type d -name "__pycache__" -exec rm -rf {} + 2>/dev/null || true
          find package -type d -name "venv" -exec rm -rf {} + 2>/dev/null || true
          find package -type f -name "*.pyc" -delete 2>/dev/null || true

          # Create the zip file excluding cache, bytecode, venv, and transient files
          cd package
          zip -r ../inkmcp-extension.zip . -x "**/__pycache__/*" "*__pycache__*" "*.pyc" "**/venv/*" "*venv*" "*.DS_Store" "*~" "*.swp"
          cd ..

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@c062e08bd532815e2082a85e87e3ef29c3e6d191 # v2.0.8
        with:
          name: Latest Development Build
          body: |
            This release contains the latest development builds of the Inkscape MCP plugin.

            ## Installation
            1. Download `inkmcp-extension.zip`
            2. Extract it to your Inkscape extensions directory: `~/.config/inkscape/extensions/` (Linux)
            3. Restart Inkscape
            4. The extension will appear under Extensions > MCP
          draft: false
          prerelease: true
          files: |
            inkmcp-extension.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
